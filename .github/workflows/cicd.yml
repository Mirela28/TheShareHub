name: Backend CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build backend 
        run: ./gradlew build -x test

      - name: Run unit tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew test

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull frontend image (if available) - do not fail if missing
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/thesharehub-frontend:latest || true

      - name: Build backend Docker image
        env:
          IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}/thesharehub-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $IMAGE_BASE:latest -t $IMAGE_BASE:$IMAGE_TAG .
          docker push $IMAGE_BASE:$IMAGE_TAG
          docker push $IMAGE_BASE:latest

      - name: (Optional) Re-push frontend image if you pulled a newer local build
        run: |
          if docker image inspect ${{ secrets.DOCKERHUB_USERNAME }}/thesharehub-frontend:latest > /dev/null 2>&1; then
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/thesharehub-frontend:latest
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create .env file for docker-compose (from secrets)
        run: |
          cat > .env <<EOF
          MYSQL_DATABASE=sharehub
          MYSQL_USER=${{ secrets.DB_USER }}
          MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          EOF

      - name: Setup Docker Compose (v2)
        uses: docker/compose-action@v2
        with:
          install: true

      - name: Deploy with docker compose
        run: |
          # Use the local docker-compose.yml in this repo (backend repo contains compose file)
          docker compose --env-file .env up -d --build

      
