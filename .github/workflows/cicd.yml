name: Java & Frontend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout backend repo
      - name: Checkout backend
        uses: actions/checkout@v4

      # Set up JDK 24 for Gradle/Spring Boot
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      # Make gradlew executable
      - name: Grant execute permission
        run: chmod +x gradlew

      # Cache Gradle dependencies
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Build backend (without tests)
      - name: Build backend
        run: ./gradlew clean build -x test

      # Run unit tests
      - name: Run backend unit tests
        run: ./gradlew test

      # Run integration tests
      - name: Run backend integration tests
        run: ./gradlew integrationTest || true  # optional: allow failures

      # Start backend in background
      - name: Start backend server
        run: |
          ./gradlew bootRun &
          npx wait-on http://localhost:8080

      # Checkout frontend repo
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Mirela28/thesharehub-frontend
          ref: master
          path: frontend

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Start frontend server (optional if needed for Cypress)
      - name: Start frontend server
        working-directory: frontend
        run: |
          npm start &
          npx wait-on http://localhost:3000

      # Run Cypress tests
      - name: Run Cypress tests
        working-directory: frontend
        run: npx cypress run

      # Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Build & push backend Docker image
      - name: Build & push backend Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          context: .
          file: Dockerfile
          image: mirela28/thesharehub-backend
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: latest

      # Build & push frontend Docker image
      - name: Build & push frontend Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          image: mirela28/thesharehub-frontend
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: latest
