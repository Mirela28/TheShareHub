name: Backend CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
           path: |
             ~/.gradle/caches
             ~/.gradle/wrapper/
           key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
           restore-keys: |
             ${{ runner.os }}-gradle-


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build backend 
        run: ./gradlew build -x test

      - name: Run unit tests
        run: ./gradlew test

      - name: Run integration tests
        run: ./gradlew integrationTest

  backend-docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build & push backend Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: mirela28/thesharehub-backend
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: latest

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Mirela28/thesharehub-frontend
          path: frontend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run

      - name: Build frontend
        run: npm run build

      - name: Build & push frontend Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: mirela28/thesharehub-frontend
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: latest



  deploy:
    runs-on: ubuntu-latest
    needs: [backend-docker, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env file
        run: |
          cat > .env <<EOF
          MYSQL_DATABASE=sharehub
          MYSQL_USER=${{ secrets.DB_USER }}
          MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          DOCKERHUB_USERNAME=${{ secrets.DOCKER_USERNAME }}
          EOF

      - name: Setup Docker Compose (v2)
        uses: docker/compose-action@v2
        with:
          install: true

      - name: Deploy with Docker Compose
        run: |
          docker compose --env-file .env up -d --build

          
