name: Java & Frontend CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # JDK 24
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      # Gradle cache
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Make gradlew executable
      - name: Grant execute permission
        run: chmod +x gradlew

      # Build without tests first
      - name: Build backend
        run: ./gradlew build -x test

      # Unit tests
      - name: Run unit tests
        run: ./gradlew test

      # Integration tests
      - name: Run integration tests
        run: ./gradlew integrationTest

      # Build & push backend Docker image
      - name: Build & push backend Docker image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: mirela28/thesharehub-backend
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: latest

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read

    steps:
    # Fetch frontend repo
    - uses: actions/checkout@v4
      with:
        repository: Mirela28/thesharehub-frontend
        path: frontend

    # Node.js 22
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Install dependencies
    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    # Cypress tests
    - name: Run Cypress tests
      working-directory: frontend
      run: npx cypress run

    # Build frontend
    - name: Build frontend
      working-directory: frontend
      run: npm run build

    # Build & push frontend Docker image
    - name: Build & push frontend Docker image
      uses: mr-smithers-excellent/docker-build-push@v6
      with:
        context: frontend
        file: frontend/Dockerfile
        image: mirela28/thesharehub-frontend
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        tags: latest


