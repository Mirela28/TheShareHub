plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "4.4.1.3373"
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Peer-to-peer rental website'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
    implementation 'org.flywaydb:flyway-mysql:10.19.0'
    implementation 'org.flywaydb:flyway-core:10.19.0'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    implementation 'com.stripe:stripe-java:24.10.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'
}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('test') {
    useJUnitPlatform {
        filter {
            excludeTestsMatching("*integration*")
        }
    }
}


tasks.register('integrationTest', Test) {
    description = 'Runs integration tests under test profile'
    group = 'verification'
    useJUnitPlatform()
    filter {
        includeTestsMatching "*integration*"
    }
    systemProperty 'spring.profiles.active', 'test'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.test
}

tasks.named('integrationTest', Test){
    jacoco {
        enabled = true
    }
}

check.dependsOn integrationTest

jacocoTestReport {
    dependsOn(test, integrationTest)

    executionData.from(
            layout.buildDirectory.file("jacoco/test.exec"),
            layout.buildDirectory.file("jacoco/integrationTest.exec")
    )

    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property "sonar.projectKey", "thesharehub"
        property "sonar.host.url", "http://localhost:9000"
        property "sonar.token", System.getenv("SONAR_TOKEN")
        property "sonar.gradle.skipCompile", "true"

        property "sonar.tests", "src/test/java"
        property "sonar.test.inclusions", "**/*Test.java,**/*IntegrationTest.java"

        property "sonar.junit.reportPaths",
                "build/test-results/test,build/test-results/integrationTest"

        property "sonar.coverage.jacoco.xmlReportPaths",
                "build/reports/jacoco/test/jacocoTestReport.xml"

        property "sonar.java.binaries", "build/classes/java/main"

        property "sonar.coverage.exclusions",
                "**/config/**," +
                        "**/dtos/**," +
                        "**/entities/**," +
                        "**/model/**," +
                        "**/mapper/**," +
                        "**/*Application.java"

    }
}



